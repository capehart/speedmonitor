services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Long time-based retention keeps the backfilled 2022+ history; the size cap protects the SD card.
      - --storage.tsdb.retention.time=10y
      - --storage.tsdb.retention.size=6GB
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    command: --config.file=/etc/blackbox/blackbox.yml
    cap_add:
      - NET_RAW
    volumes:
      - ./blackbox:/etc/blackbox:ro

  speedtest:
    build: .
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/network.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "80:3000"
      - "3000:3000"

volumes:
  prometheus-data:
  grafana-data:
