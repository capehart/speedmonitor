rule_files: [rules.yml]
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'speedtest_download_bits_per_second{job="speedtest",instance="70055",server="A"}'
        values: '_x20 900000000 _x40'
      - series: 'speedtest_download_bits_per_second{job="speedtest",instance="14229",server="B"}'
        values: '_x30 800000000 _x30'
    promql_expr_test:
      - expr: count_over_time(job:speedtest_download_bits_per_second:pooled[30m])
        eval_time: 15m
        exp_samples:
          - labels: '{job="speedtest"}'
            value: 2
      - expr: max_over_time(job:speedtest_download_bits_per_second:pooled[30m]) - min_over_time(job:speedtest_download_bits_per_second:pooled[30m])
        eval_time: 15m
        exp_samples:
          - labels: '{job="speedtest"}'
            value: 100000000
